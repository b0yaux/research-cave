<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Cave</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  background: #1a1a1a;
  background-image: url('research-landscape/grotte-1.jpg');
  background-size: cover;
  background-position: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #e0e0e0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  pointer-events: none;
}
h1 {
  position: relative;
  font-size: 28px;
  font-weight: 600;
  letter-spacing: 0.03em;
  margin-bottom: 32px;
  text-shadow: 0 1px 6px rgba(0,0,0,0.6);
}
ul {
  position: relative;
  list-style: none;
  padding: 0;
}
li { margin-bottom: 16px; }
a {
  color: #e0e0e0;
  text-decoration: none;
  font-size: 18px;
  font-weight: 500;
  letter-spacing: 0.02em;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  transition: opacity 0.2s;
}
a:hover {
  opacity: 0.7;
  text-decoration: none;
}
</style>
</head>
<body>
<h1>Research Cave</h1>
<ul>
<li><a href="research-landscape/">Research Landscape</a></li>
<li><a href="post-binary-esotericisms/">Post-binary Esotericisms</a></li>
</ul>
</body>
</html>
