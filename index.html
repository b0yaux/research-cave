<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Cave</title>
<link href="https://fonts.googleapis.com/css2?family=Mystery+Quest&display=swap" rel="stylesheet">
<style>
body {
  background-image: url('research-landscape/grotte-1.jpg');
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  transition: background-image 0.6s ease;
  font-family: monospace;
  font-size: 14px;
  color: #e0e0e0;
  padding: 0;
  margin: 0;
  height: 100vh;
  overflow: hidden;
  position: relative;
}
h1 {
  font-family: 'Mystery Quest', cursive;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.1em;
  margin-bottom: 16px;
}
hr {
  border: none;
  border-top: 1px solid rgba(255,255,255,0.2);
  margin-bottom: 12px;
  width: 100%;
}
ul { list-style: none; padding: 0; }
li { margin-bottom: 8px; }
a { color: #e0e0e0; text-decoration: none; }
a:hover { text-decoration: underline; }
#credits {
  position: fixed;
  bottom: 16px;
  left: 16px;
  color: #ffffff;
  font-size: 12px;
  pointer-events: none;
  user-select: none;
  opacity: 0.5;
}
</style>
</head>
<body>
<div style="padding: 24px 32px;">
<h1>Research Cave</h1>
<hr>
<ul>
<li><a href="research-landscape/" data-bg="research-landscape/grotte-1.jpg">research landscape</a></li>
<li><a href="post-binary-esotericisms/" data-bg="post-binary-esotericisms/blue-cloudy-sky-sun-rays-background.jpg">post-binary esotericisms</a></li>
</ul>
</div>
<div id="credits">@jaufre @ptdrwtf @7033060007</div>
<script>
const defaultBg = getComputedStyle(document.body).backgroundImage;
document.querySelectorAll('ul a[data-bg]').forEach(a => {
  const img = new Image();
  img.src = a.dataset.bg;
  a.addEventListener('mouseenter', () => document.body.style.backgroundImage = `url('${a.dataset.bg}')`);
  a.addEventListener('mouseleave', () => document.body.style.backgroundImage = defaultBg);
});
</script>
</body>
</html>
